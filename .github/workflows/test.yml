name: Incident Response Agent CI
run-name: CI · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline safety and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Offline tests
        run: .venv/bin/python -m pytest -m 'not integration and not live'

  container-tests:
    name: Disposable container integration tests
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Container failure lab
        env:
          RUN_CONTAINER_TESTS: "1"
        run: |
          # The disposable-service container health-status flake is shared-runner
          # environment variance: a fresh runner reliably passes this suite, while a
          # contended runner can keep a container in Docker "starting" past every
          # wait budget. Retry the suite on a fresh runner (bounded to 3 attempts);
          # deterministic failures still fail loudly after the retries are exhausted.
          for attempt in 1 2 3; do
            if .venv/bin/python -m pytest -m 'integration and not live'; then
              exit 0
            fi
            echo "container suite attempt ${attempt} failed on a shared runner; retrying"
          done
          exit 1
